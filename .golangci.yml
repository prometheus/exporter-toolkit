formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/prometheus/exporter-toolkit
linters:
  enable:
    - errorlint
    - misspell
    - modernize
    - revive
    - sloglint
    # Correctness linters (low-noise, no findings on the current tree).
    - copyloopvar
    - durationcheck
    - gocritic
    - makezero
    - unconvert
    - wastedassign
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test.go
  settings:
    errcheck:
      exclude-functions:
        # Used in HTTP handlers, any error is handled by the server itself.
        - (net/http.ResponseWriter).Write
    govet:
      enable-all: true
      disable:
        # Struct field ordering is not worth the churn/readability cost.
        - fieldalignment
        # err shadowing is idiomatic and used throughout the codebase.
        - shadow
version: "2"
